<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meditatieve Tala Generator</title>
    <style>
        body {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: #16213e;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #0f3460;
        }
        h1 { font-weight: 300; letter-spacing: 2px; color: #4ecca3; }
        .controls { margin: 20px 0; display: flex; gap: 10px; justify-content: center; align-items: center; }
        input { 
            background: #0f3460; border: 1px solid #4ecca3; color: white; 
            padding: 8px; border-radius: 5px; width: 80px; text-align: center;
        }
        button { 
            background: #4ecca3; border: none; color: #1a1a2e; 
            padding: 10px 20px; border-radius: 5px; cursor: pointer; 
            font-weight: bold; transition: 0.3s;
        }
        button:hover { background: #45b393; transform: scale(1.05); }
        .status { font-style: italic; color: #95a5a6; margin-top: 10px; font-size: 0.9rem; }
        .seed-display { font-family: monospace; color: #4ecca3; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tala Generator</h1>
        <p>Meditatieve polyritmiek met morphing samples</p>
        
        <div class="controls">
            <label>Seed:</label>
            <input type="text" id="seedInput" placeholder="Random">
            <button id="startBtn">Start Ritme</button>
        </div>
        
        <div class="status" id="status">Klaar om te mediteren...</div>
        <div class="status">Huidige Seed: <span class="seed-display" id="currentSeed">-</span></div>
    </div>

    <!-- 1. LOAD YOUR DATA FILE FIRST -->
    <script src="drumkit.js"></script>

        <script>
        // --- DYNAMIC CONFIGURATION ---
        let audioCtx;
        let isPlaying = false;
        let nextStepTime = 0;
        let currentStep = 0;
        let timerID;

        const buffers = {}; 
        const sampleGroups = {};
        const currentGroupIndex = { bass: 0, snare: 0, hat: 0, perc: 0 };
        
        const PREFIX_MAP = {
            'bd': 'bass', 'bn': 'snare', 'hc': 'hat', 'ho': 'hat',
            'pl': 'perc', 'pc': 'perc', 'dr': 'perc', 'dv': 'perc',
            'sd': 'perc', 'tl': 'perc', 'tm': 'perc', 'tn': 'perc'
        };

        let baseBPM = 135; 
        let currentBPM = baseBPM;
        const BPM_DRIFT_RANGE = 8; 
        const BPM_DRIFT_SPEED = 0.05; 

        // State tracking
        let currentMode = 'RITUAL'; // 'RITUAL' or 'CHAOS'
        let modeTimer = 0;

        function sfc32(a, b, c, d) {
            return function() {
                a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; 
                var t = (a + b | 0) + d | 0;
                d = d + 1 | 0;
                a = b ^ b >>> 9;
                b = c + (c << 3) | 0;
                c = (c << 21 | c >>> 11);
                c = c + t | 0;
                return (t >>> 0) / 4294967296;
            }
        }

        async function loadAllSamples() {
            for (let fileName in DRUMKIT) {
                const prefix = fileName.substring(0, 2);
                const category = PREFIX_MAP[prefix];
                if (category) {
                    if (!sampleGroups[category]) sampleGroups[category] = [];
                    sampleGroups[category].push(fileName);
                }
            }
            const loadPromises = [];
            for (let fileName in DRUMKIT) {
                loadPromises.push((async () => {
                    const dataUrl = DRUMKIT[fileName];
                    const response = await fetch(dataUrl);
                    const arrayBuffer = await response.arrayBuffer();
                    buffers[fileName] = await audioCtx.decodeAudioData(arrayBuffer);
                })());
            }
            await Promise.all(loadPromises);
        }

        function evolveSamples() {
            for (let cat in currentGroupIndex) {
                // Slower, more purposeful evolution during Ritual, faster during Chaos
                const prob = (currentMode === 'RITUAL') ? 0.10 : 0.40;
                if (seedRand() > (1 - prob)) {
                    const group = sampleGroups[cat];
                    if (group && group.length > 1) {
                        currentGroupIndex[cat] = (currentGroupIndex[cat] + 1) % group.length;
                    }
                }
            }
        }

        function playSample(category, time, velocity = 1.0) {
            const groupFiles = sampleGroups[category];
            if (!groupFiles) return;

            const idx = currentGroupIndex[category];
            const file1 = groupFiles[idx];
            const file2 = groupFiles[(idx + 1) % groupFiles.length];

            const freqMap = { bass: [0.1, 0.2], snare: [0.2, 0.4], hat: [0.5, 0.8], perc: [0.3, 0.6] };

            const play = (fileName, freq) => {
                const source = audioCtx.createBufferSource();
                const gain = audioCtx.createGain();
                const volumeWave = (Math.sin(audioCtx.currentTime * freq * Math.PI * 2) + 1) / 2;
                source.buffer = buffers[fileName];
                gain.gain.value = volumeWave * 0.5 * velocity; 
                source.connect(gain);
                gain.connect(audioCtx.destination);
                const startTime = Math.max(time, audioCtx.currentTime);
                source.start(startTime + (seedRand() * 0.002));
            };

            play(file1, freqMap[category][0]);
            play(file2, freqMap[category][1]);
        }

        function scheduler() {
            currentBPM = baseBPM + Math.sin(audioCtx.currentTime * BPM_DRIFT_SPEED) * BPM_DRIFT_RANGE;
            const stepDuration = 60 / currentBPM / 2; 

            while (nextStepTime < audioCtx.currentTime + 0.1) {
                scheduleStep(currentStep, nextStepTime);
                
                // Handle Mode Switching
                modeTimer++;
                if (modeTimer > 64) { // Every 4 cycles, check for mode shift
                    if (currentMode === 'RITUAL' && seedRand() > 0.8) {
                        currentMode = 'CHAOS';
                        modeTimer = 0;
                        console.log("⚡ CHAOS STRIKES ⚡");
                    } else if (currentMode === 'CHAOS' && seedRand() > 0.7) {
                        currentMode = 'RITUAL';
                        modeTimer = 0;
                        console.log("🧘 Returning to Ritual...");
                    }
                }

                if (currentStep % 8 === 0) evolveSamples();
                
                nextStepTime += stepDuration;
                currentStep++;
            }
            timerID = setTimeout(scheduler, 25);
        }

        function scheduleStep(step, time) {
            const cycle = step % 16;

            if (currentMode === 'RITUAL') {
                // --- STRUCTURED RITUAL MODE ---
                // Heartbeat
                if (cycle % 4 === 0) playSample('bass', time, 1.2);
                else if (cycle % 4 === 2) {
                    playSample('bass', time, 0.7);
                    playSample('bass', time + (60/currentBPM/4), 0.5);
                }

                // Consistent Shaker
                if (cycle % 2 === 0) playSample('hat', time, 0.3);

                // Punctuated Percussion
                if ([0, 6, 8, 14].includes(cycle)) playSample('perc', time, 0.6);

                // Phrase ending
                if (cycle === 15) playSample('snare', time, 0.8);

            } else {
                // --- WILD CHAOS MODE ---
                // Bass becomes a frantic roll
                if (seedRand() > 0.3) playSample('bass', time, 1.0);
                
                // Percussion explodes
                if (seedRand() > 0.4) playSample('perc', time, 0.9);
                if (seedRand() > 0.6) playSample('perc', time + (60/currentBPM/8), 0.7);

                // Snares hit randomly and aggressively
                if (seedRand() > 0.8) playSample('snare', time, 1.1);
                
                // High-energy rattling
                if (seedRand() > 0.1) playSample('hat', time, 0.6);
            }
        }

        let seedRand;
        function initSeed() {
            const seedVal = document.getElementById('seedInput').value || Math.random().toString(36).substring(7);
            document.getElementById('currentSeed').innerText = seedVal;
            let seedNum = 0;
            for (let i = 0; i < seedVal.length; i++) seedNum += seedVal.charCodeAt(i);
            seedRand = sfc32(seedNum, 0x9E3779B9, 0x243F6A88, 0xB7E15162);

            for (let cat in currentGroupIndex) {
                const group = sampleGroups[cat];
                if (group) currentGroupIndex[cat] = Math.floor(seedRand() * group.length);
            }
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            if (isPlaying) {
                isPlaying = false;
                clearTimeout(timerID);
                document.getElementById('startBtn').innerText = "Start Ritme";
                return;
            }
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('status').innerText = "Laden van alle samples...";
            try {
                await loadAllSamples();
                initSeed();
                isPlaying = true;
                nextStepTime = audioCtx.currentTime;
                currentStep = 0;
                scheduler();
                document.getElementById('startBtn').innerText = "Stop Ritme";
                document.getElementById('status').innerText = "The ritual has begun...";
            } catch (e) {
                document.getElementById('status').innerText = "Fout: " + e.message;
            }
        });
    </script>






</body>
</html>
