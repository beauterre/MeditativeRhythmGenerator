<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drumkit DataURL Generator</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #eee; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        #drop-zone {
            width: 500px; height: 200px; border: 3px dashed #555;
            border-radius: 20px; display: flex; align-items: center;
            justify-content: center; text-align: center; cursor: pointer;
            transition: all 0.3s; margin-bottom: 20px;
        }
        #drop-zone.hover { border-color: #00ffcc; background: #222; }
        #file-list { width: 500px; max-height: 300px; overflow-y: auto; margin-bottom: 20px; font-size: 12px; }
        .file-item { background: #333; padding: 5px 10px; margin: 2px 0; border-radius: 4px; display: flex; justify-content: space-between; }
        button {
            padding: 15px 30px; font-size: 18px; cursor: pointer;
            background: #00ffcc; border: none; border-radius: 5px;
            font-weight: bold; color: #1a1a1a; display: none;
        }
    </style>
</head>
<body>

    <h1>🥁 Drumkit JS Generator</h1>
    <p>Drop your .mp3 and .wav files here.</p>

    <div id="drop-zone">Drop Audio Files Here <br>(or click to select)</div>
    <input type="file" id="file-input" multiple accept="audio/*" style="display:none">
    
    <div id="file-list"></div>
    <button id="download-btn">Download drumkit.js</button>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileListDiv = document.getElementById('file-list');
        const downloadBtn = document.getElementById('download-btn');
        
        let audioData = {}; 

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('hover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('hover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('hover');
            handleFiles(e.dataTransfer.files);
        };

        fileInput.onchange = (e) => handleFiles(e.target.files);

        async function handleFiles(files) {
            for (let file of files) {
                if (file.type.startsWith('audio/')) {
                    const dataUrl = await convertToBase64(file);
                    audioData[file.name] = dataUrl;
                    
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.innerHTML = `<span>file.name</span><span>{file.name}</span> <span>file.name</span><span>{(file.size / 1024).toFixed(1)} KB</span>`;
                    fileListDiv.appendChild(item);
                }
            }
            downloadBtn.style.display = 'block';
        }

        function convertToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        downloadBtn.onclick = () => {
            // This creates a standard JS file that attaches the object to the window
            const jsContent = `var DRUMKIT = ${JSON.stringify(audioData, null, 4)};`;
            
            const blob = new Blob([jsContent], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'drumkit.js';
            a.click();
            URL.revokeObjectURL(url);
        };
    </script>
</body>
</html>
